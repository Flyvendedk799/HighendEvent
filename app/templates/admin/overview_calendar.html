{% extends "admin/base.html" %}

{% block title %}Oversigts Kalender - Admin{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Oversigts Kalender</h1>
                <p class="text-lg text-gray-600">Se alle bookinger og tilgængelighed på tværs af produkter</p>
            </div>
            <div class="flex items-center space-x-3">
                <a href="{{ url_for('admin.bookings') }}" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors duration-200">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                    </svg>
                    Booking liste
                </a>
                <button id="refresh-calendar" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors duration-200">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Opdater
                </button>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Product Filter -->
            <div>
                <label for="product-filter" class="block text-sm font-medium text-gray-700 mb-2">Filtrer efter produkt</label>
                <select id="product-filter" class="block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">Alle produkter</option>
                    {% for product in products %}
                    <option value="{{ product.id }}">{{ product.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Status Legend -->
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-2">Status farver</label>
                <div class="flex flex-wrap gap-4">
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-yellow-500 rounded mr-2"></div>
                        <span class="text-sm text-gray-600">Afventer betaling</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-green-500 rounded mr-2"></div>
                        <span class="text-sm text-gray-600">Betalt</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-blue-500 rounded mr-2"></div>
                        <span class="text-sm text-gray-600">Afsluttet</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-gray-500 rounded mr-2"></div>
                        <span class="text-sm text-gray-600">Andre</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Calendar -->
    <div class="bg-white rounded-xl shadow-xl border border-gray-200">
        <div class="p-6">
            <div id="overview-calendar" class="w-full" style="min-height: 600px;"></div>
        </div>
    </div>
</div>

<!-- Booking Details Modal -->
<div id="booking-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50" style="display: none;">
    <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-2xl shadow-lg rounded-lg bg-white">
        <div class="mt-3">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-900" id="modal-title">Booking detaljer</h3>
                <button type="button" class="text-gray-400 hover:text-gray-600" onclick="closeModal()">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div id="modal-content" class="space-y-4">
                <!-- Content will be populated by JavaScript -->
            </div>
            
            <div class="flex items-center justify-end space-x-3 mt-6 pt-6 border-t border-gray-200">
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors">
                    Luk
                </button>
                <a id="view-booking-btn" href="#" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                    Se booking
                </a>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    let calendar;
    
    // Initialize calendar
    const calendarEl = document.getElementById('overview-calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        firstDay: 1, // Start with Monday
        locale: 'da',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },
        buttonText: {
            today: 'I dag',
            month: 'Måned',
            week: 'Uge'
        },
        height: 'auto',
        aspectRatio: 1.8,
        events: {
            url: '{{ url_for("admin.api_overview_calendar_data") }}',
            extraParams: function() {
                const productFilter = document.getElementById('product-filter').value;
                return productFilter ? { product_id: productFilter } : {};
            },
            failure: function(error) {
                console.error('Error loading calendar data:', error);
                showNotification('Fejl ved indlæsning af kalender data', 'error');
            }
        },
        eventClick: function(info) {
            showBookingDetails(info.event);
        },
        eventDidMount: function(info) {
            // Add tooltip
            info.el.title = `${info.event.extendedProps.customer_name} - ${info.event.extendedProps.products.join(', ')}`;
        },
        loading: function(isLoading) {
            if (isLoading) {
                document.getElementById('refresh-calendar').innerHTML = '<svg class="w-4 h-4 mr-2 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>Indlæser...';
            } else {
                document.getElementById('refresh-calendar').innerHTML = '<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>Opdater';
            }
        }
    });
    
    calendar.render();
    
    // Product filter change
    document.getElementById('product-filter').addEventListener('change', function() {
        calendar.refetchEvents();
    });
    
    // Refresh button
    document.getElementById('refresh-calendar').addEventListener('click', function() {
        calendar.refetchEvents();
    });
    
    // Show booking details modal
    function showBookingDetails(event) {
        const props = event.extendedProps;
        
        document.getElementById('modal-title').textContent = `Booking ${props.booking_no}`;
        document.getElementById('view-booking-btn').href = `{{ url_for('admin.booking_detail', id=0) }}`.replace('0', event.id);
        
        const content = document.getElementById('modal-content');
        content.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <h4 class="font-semibold text-gray-900 mb-2">Kunde information</h4>
                    <div class="space-y-1 text-sm">
                        <p><span class="font-medium">Navn:</span> ${props.customer_name}</p>
                        <p><span class="font-medium">Email:</span> ${props.customer_email}</p>
                        <p><span class="font-medium">Telefon:</span> ${props.customer_phone}</p>
                    </div>
                </div>
                
                <div>
                    <h4 class="font-semibold text-gray-900 mb-2">Booking detaljer</h4>
                    <div class="space-y-1 text-sm">
                        <p><span class="font-medium">Status:</span> 
                            <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium ${getStatusBadgeClass(props.status)}">
                                ${getStatusText(props.status)}
                            </span>
                        </p>
                        <p><span class="font-medium">Periode:</span> ${formatDate(event.start)} - ${formatDate(new Date(event.end.getTime() - 86400000))}</p>
                        <p><span class="font-medium">Total:</span> ${props.total.toLocaleString('da-DK', {minimumFractionDigits: 2})} DKK</p>
                        <p><span class="font-medium">Antal produkter:</span> ${props.item_count}</p>
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <h4 class="font-semibold text-gray-900 mb-2">Produkter</h4>
                <div class="bg-gray-50 rounded-lg p-3">
                    <ul class="text-sm space-y-1">
                        ${props.products.map(product => `<li>• ${product}</li>`).join('')}
                    </ul>
                </div>
            </div>
        `;
        
        document.getElementById('booking-modal').style.display = 'block';
    }
    
    // Make function global
    window.showBookingDetails = showBookingDetails;
});

function closeModal() {
    document.getElementById('booking-modal').style.display = 'none';
}

function getStatusBadgeClass(status) {
    switch(status) {
        case 'pending': return 'bg-yellow-100 text-yellow-800';
        case 'paid': return 'bg-green-100 text-green-800';
        case 'fulfilled': return 'bg-blue-100 text-blue-800';
        default: return 'bg-gray-100 text-gray-800';
    }
}

function getStatusText(status) {
    switch(status) {
        case 'pending': return 'Afventer betaling';
        case 'paid': return 'Betalt';
        case 'fulfilled': return 'Afsluttet';
        case 'cancelled': return 'Annulleret';
        default: return status;
    }
}

function formatDate(date) {
    return date.toLocaleDateString('da-DK', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
}

function showNotification(message, type = 'info') {
    // Simple notification - you can enhance this
    alert(message);
}
</script>

{% endblock %}
