{% extends "admin/base.html" %}

{% block title %}Booking Kalender - Admin{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-4">Booking Kalender</h1>
        <p class="text-lg text-gray-600">Oversigt over alle bookinger</p>
    </div>
    
    <!-- Calendar -->
    <div class="bg-white border border-gray-200 rounded-lg p-6">
        <div id="calendar"></div>
    </div>
    
    <!-- Legend -->
    <div class="mt-6 flex flex-wrap items-center justify-center space-x-6">
        <div class="flex items-center">
            <div class="w-4 h-4 bg-yellow-100 border border-yellow-300 rounded mr-2"></div>
            <span class="text-sm text-gray-600">Afventer</span>
        </div>
        <div class="flex items-center">
            <div class="w-4 h-4 bg-green-100 border border-green-300 rounded mr-2"></div>
            <span class="text-sm text-gray-600">Betalt</span>
        </div>
        <div class="flex items-center">
            <div class="w-4 h-4 bg-blue-100 border border-blue-300 rounded mr-2"></div>
            <span class="text-sm text-gray-600">Fuldført</span>
        </div>
        <div class="flex items-center">
            <div class="w-4 h-4 bg-red-100 border border-red-300 rounded mr-2"></div>
            <span class="text-sm text-gray-600">Annulleret</span>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'da',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,dayGridWeek,listWeek'
        },
        events: function(info, successCallback, failureCallback) {
            // Fetch bookings data
            fetch(`/api/bookings/calendar-data?start=${info.startStr}&end=${info.endStr}`)
                .then(response => response.json())
                .then(data => {
                    successCallback(data);
                })
                .catch(error => {
                    console.error('Error fetching calendar data:', error);
                    failureCallback(error);
                });
        },
        eventClick: function(info) {
            // Open booking detail page
            if (info.event.url) {
                window.open(info.event.url, '_blank');
            }
        },
        dayMaxEvents: 3,
        height: 'auto'
    });
    
    calendar.render();
});
</script>
{% endblock %}
