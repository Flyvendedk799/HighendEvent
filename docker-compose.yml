services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rentora
      POSTGRES_PASSWORD: rentora
      POSTGRES_DB: rentora
    ports:
      - "5432:5432"
    volumes:
      - rentora_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  rentora_pg:
