<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Notification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #4F46E5;
            margin-bottom: 10px;
        }
        .notification-title {
            color: #1F2937;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .alert-box {
            background-color: #FEF3C7;
            border: 1px solid #F59E0B;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .alert-icon {
            font-size: 24px;
            margin-right: 10px;
        }
        .message-content {
            background-color: #F9FAFB;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            white-space: pre-line;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #E5E7EB;
            color: #6B7280;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><img src="{{ url_for('static', filename='images/logo1.png', _external=True) }}" alt="HighendEvent Logo" style="height: 40px; width: auto; vertical-align: middle; margin-right: 10px;">HighendEvent</div>
            <h1 class="notification-title">Admin Notification</h1>
        </div>
        
        <div class="alert-box">
            <span class="alert-icon">⚠️</span>
            <strong>System Notification</strong>
        </div>
        
        <div class="message-content">
            {{ message }}
        </div>
        
        <p>Denne notification blev sendt automatisk fra HighendEvent systemet.</p>
        
        <div class="footer">
            <p>HighendEvent - Admin Panel</p>
            <p>Denne email blev sendt til system administratorer.</p>
        </div>
    </div>
</body>
</html>
