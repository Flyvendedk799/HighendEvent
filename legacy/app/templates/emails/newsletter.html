<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #4F46E5;
            margin-bottom: 10px;
        }
        .newsletter-title {
            color: #1F2937;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .content {
            margin-bottom: 30px;
        }
        .content h1, .content h2, .content h3 {
            color: #1F2937;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .content h1 {
            font-size: 22px;
        }
        .content h2 {
            font-size: 20px;
        }
        .content h3 {
            font-size: 18px;
        }
        .content p {
            margin-bottom: 15px;
        }
        .content ul, .content ol {
            margin-bottom: 15px;
            padding-left: 20px;
        }
        .content li {
            margin-bottom: 5px;
        }
        .highlight {
            background-color: #F3F4F6;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .cta-button {
            display: inline-block;
            background-color: #4F46E5;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin: 20px 0;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #E5E7EB;
            color: #6B7280;
            font-size: 14px;
        }
        .social-links {
            margin: 20px 0;
        }
        .social-links a {
            color: #4F46E5;
            text-decoration: none;
            margin: 0 10px;
        }
        .unsubscribe {
            margin-top: 20px;
            font-size: 12px;
        }
        .unsubscribe a {
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><img src="{{ url_for('static', filename='images/logo1.png', _external=True) }}" alt="HighendEvent Logo" style="height: 40px; width: auto; vertical-align: middle; margin-right: 10px;">HighendEvent</div>
            <h1 class="newsletter-title">{{ title }}</h1>
        </div>
        
        <div class="content">
            {{ content | safe }}
        </div>
        
        <div style="text-align: center;">
            <a href="{{ url_for('public.index', _external=True) }}" class="cta-button">
                Besøg vores hjemmeside
            </a>
        </div>
        
        <div class="footer">
            <div class="social-links">
                <a href="#">Facebook</a> |
                <a href="#">Instagram</a> |
                <a href="#">LinkedIn</a>
            </div>
            <p>HighendEvent - Professionelt udstyr til dine events</p>
            <div class="unsubscribe">
                <p>Du modtager denne email fordi du er tilmeldt vores nyhedsbrev. <a href="#">Afmeld dig her</a>.</p>
            </div>
        </div>
    </div>
</body>
</html>
