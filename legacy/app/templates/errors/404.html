{% extends "base.html" %}

{% block title %}Siden blev ikke fundet - Festudlej{% endblock %}

{% block content %}
<div class="bg-white min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full text-center">
        <div class="mb-8">
            <h1 class="text-9xl font-bold text-indigo-600">404</h1>
            <h2 class="text-2xl font-semibold text-gray-900 mb-4">Siden blev ikke fundet</h2>
            <p class="text-gray-600 mb-8">
                Beklager, men den side du leder efter eksisterer ikke.
            </p>
        </div>
        
        <div class="space-y-4">
            <a href="{{ url_for('public.index') }}" 
               class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">
                Gå til forsiden
            </a>
            
            <div>
                <a href="{{ url_for('public.catalog') }}" 
                   class="text-indigo-600 hover:text-indigo-500 font-medium">
                    Se vores udstyr
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
