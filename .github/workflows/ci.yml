name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://rentora:rentora@localhost:5432/rentora

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rentora
          POSTGRES_PASSWORD: rentora
          POSTGRES_DB: rentora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # A schema change without a matching migration silently breaks every deploy, so the
      # mismatch has to fail here rather than in production.
      - name: Check migrations match the schema
        run: pnpm db:check-migrations

      - name: Seed the database
        run: pnpm db:seed

      # Proves two tenants on one database cannot see each other, against real Postgres.
      - name: Tenant isolation check
        run: pnpm check:isolation

      - name: Domain package tests
        run: pnpm --filter @rentora/domain test

      - name: Build packages
        run: >
          pnpm --filter @rentora/domain --filter @rentora/db --filter @rentora/ui
          --filter @rentora/worker build

      - name: API tests
        run: pnpm --filter @rentora/api test

      - name: Build API
        run: pnpm --filter @rentora/api build

      - name: Build web
        run: pnpm --filter @rentora/web build

      - name: Typecheck
        run: pnpm typecheck
