name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://rentora:rentora@localhost:5432/rentora

      - name: Domain package tests
        run: pnpm --filter @rentora/domain test

      - name: Build packages
        run: pnpm --filter @rentora/domain --filter @rentora/db --filter @rentora/ui --filter @rentora/worker build
        env:
          DATABASE_URL: postgresql://rentora:rentora@localhost:5432/rentora

      - name: Typecheck
        run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://rentora:rentora@localhost:5432/rentora
