name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rentora
          POSTGRES_PASSWORD: rentora
          POSTGRES_DB: rentora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentora -d rentora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rentora:rentora@localhost:5432/rentora

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @rentora/db migrate:deploy

      - name: Domain package tests
        run: pnpm --filter @rentora/domain test

      - name: Build packages
        run: pnpm --filter @rentora/domain --filter @rentora/db --filter @rentora/ui --filter @rentora/worker build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API
        run: pnpm --filter @rentora/api build

      - name: Build web
        run: pnpm --filter @rentora/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
